<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App — Day 20</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0b0f19;
            color: #e8edf5;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .app {
            max-width: 900px;
            margin: 0 auto;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 { font-size: 24px; font-weight: 700; }
        h1 span { color: #00c9a7; }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            padding: 9px 14px;
            background: #131929;
            border: 1px solid #1e2740;
            border-radius: 8px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            width: 200px;
            transition: border-color 0.3s;
        }

        .search-input:focus { border-color: #00c9a7; }
        .search-input::placeholder { color: #6b7a99; }

        .add-btn {
            padding: 9px 18px;
            background: #00c9a7;
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .add-btn:hover { background: #00a88b; }

        /* stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #6b7a99;
        }

        .stats-bar span { color: #00c9a7; font-weight: 600; }

        /* filter tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 5px 14px;
            background: #131929;
            border: 1px solid #1e2740;
            border-radius: 20px;
            font-size: 12px;
            color: #6b7a99;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-tab.active {
            background: #00c9a7;
            border-color: #00c9a7;
            color: #0b0f19;
            font-weight: 600;
        }
